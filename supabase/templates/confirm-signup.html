<!-- Supabase > Authentication > Email Templates > "Confirm signup". Subject: Confirm your LectureLoop account -->
<div style="margin:0;padding:32px 16px;background:#f5f3f8;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d1a24">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3e0ea">
    <div style="background:#57068c;padding:18px 24px;color:#ffffff;font-size:18px;font-weight:600">LectureLoop</div>
    <div style="padding:28px 24px">
      <h1 style="margin:0 0 12px;font-size:22px">Confirm your account</h1>
      <p style="margin:0 0 20px;line-height:1.6;color:#4b4558">Thanks for signing up. Tap the button to confirm your NYU email and start taking notes.</p>
      <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/confirm-email?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#57068c;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600">Confirm my account</a></p>
      <p style="margin:0;font-size:13px;line-height:1.6;color:#6b657a">If you didn't create a LectureLoop account, you can ignore this email.</p>
    </div>
    <div style="padding:14px 24px;border-top:1px solid #e3e0ea;font-size:12px;color:#8a8499">LectureLoop is an independent student project, not affiliated with NYU.</div>
  </div>
</div>
